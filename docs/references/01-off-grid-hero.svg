<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
<defs>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
        text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        .shadow-sm { filter: drop-shadow(0px 2px 4px rgba(18, 27, 23, 0.04)); }
        .shadow-md { filter: drop-shadow(0px 8px 16px rgba(18, 27, 23, 0.08)); }
    </style>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E5631" />
        <stop offset="100%" stop-color="#143D22" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F6F8F6" />
        <stop offset="100%" stop-color="#EEF2EF" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#121B17" flood-opacity="0.06"/>
    </filter>
</defs>
<!-- Background Canvas -->
<rect width="1440" height="900" fill="#F6F8F6"/>
<rect x="0" y="0" width="1440" height="900" fill="url(#sageGrad)" opacity="0.5"/>

<!-- Top Navigation Header -->
<rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" opacity="0.9" filter="url(#cardShadow)"/>
<line x1="0" y1="80" x2="1440" y2="80" stroke="#DDE4E0" stroke-width="1"/>

<!-- Header Brand Mark -->
<g transform="translate(64, 22)">
    <!-- Neighborly Tree Logo Icon -->
    <rect x="0" y="4" width="32" height="32" rx="8" fill="#E4EFE7"/>
    <path fill="#1E5631" d="M16 8 L8 24 L14 24 L11 30 L21 30 L18 24 L24 24 Z"/>
    <text x="44" y="26" font-size="22" font-weight="800" fill="#121B17" letter-spacing="-0.5px">neighborly</text>
    <rect x="156" y="10" width="48" height="18" rx="9" fill="#E4EFE7"/>
    <text x="162" y="23" font-size="10" font-weight="700" fill="#1E5631">CIVIC</text>
</g>

<!-- Header Nav Items -->
<g transform="translate(540, 46)">
    <text x="0" y="0" font-size="15" font-weight="600" fill="#121B17">Discover</text>
    <text x="110" y="0" font-size="15" font-weight="500" fill="#526059">How it Works</text>
    <text x="240" y="0" font-size="15" font-weight="500" fill="#526059">Trust &amp; Safety</text>
    <text x="380" y="0" font-size="15" font-weight="500" fill="#526059">Neighborhoods</text>
</g>

<!-- Header Action -->
<g transform="translate(1240, 22)">
    <rect width="136" height="40" rx="10" fill="#1E5631"/>
    <text x="68" y="25" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Enter Demo</text>
</g>

<!-- HERO MAIN CONTENT (60/40 Asymmetric Layout) -->

<!-- Left Column: Copy & CTAs (60% width target) -->
<g transform="translate(96, 210)">
    <!-- Tagline Badge -->
    <rect width="210" height="32" rx="16" fill="#E4EFE7"/>
    <circle cx="16" cy="16" r="4" fill="#1E5631"/>
    <text x="28" y="21" font-size="12" font-weight="700" fill="#1E5631" letter-spacing="0.5px">CIVIC RESOURCE SHARING</text>

    <!-- Main Headline H1 -->
    <text x="0" y="100" font-size="52" font-weight="800" fill="#121B17" letter-spacing="-1.5px">
        <tspan x="0" dy="0">Borrow the pressure washer.</tspan>
        <tspan x="0" dy="64">Lend the tent.</tspan>
        <tspan x="0" dy="64" fill="#1E5631">Own less stuff.</tspan>
    </text>

    <!-- Subheadline Paragraph -->
    <text x="0" y="320" font-size="19" font-weight="400" fill="#526059" width="580">
        <tspan x="0" dy="0">Neighborly helps neighbors share everyday tools, camping gear,</tspan>
        <tspan x="0" dy="28">and lawn care equipment, saving money and storage space</tspan>
        <tspan x="0" dy="28">without corporate ad tracking.</tspan>
    </text>

    <!-- Hero Buttons -->
    <g transform="translate(0, 420)">
        <!-- Primary Action -->
        <rect width="230" height="56" rx="14" fill="url(#forestGrad)" filter="url(#cardShadow)"/>
        <text x="115" y="34" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Explore Nearby Items →</text>

        <!-- Secondary Action -->
        <rect x="250" width="190" height="56" rx="14" fill="#FFFFFF" stroke="#DDE4E0" stroke-width="1.5"/>
        <text x="345" y="34" font-size="16" font-weight="600" fill="#121B17" text-anchor="middle">Watch 1-Min Tour</text>
    </g>

    <!-- Hero Trust Pill -->
    <g transform="translate(0, 515)">
        <circle cx="10" cy="10" r="3" fill="#1E5631"/>
        <text x="22" y="14" font-size="13" font-weight="500" fill="#798880">Zero membership fees • Seeded read-only demo available instantly</text>
    </g>
</g>

<!-- Right Column: Off-Grid Visual Hero Assembly (40% width target) -->
<g transform="translate(780, 150)">
    <!-- Large Background Visual Card (DeWalt Pressure Washer Card) -->
    <rect x="40" y="40" width="520" height="580" rx="24" fill="#FFFFFF" stroke="#DDE4E0" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Image Crop Frame -->
    <rect x="64" y="64" width="472" height="300" rx="16" fill="#F0F4F1"/>
    <!-- Simulated Real Listing Photo Graphics: Pressure Washer -->
    <rect x="180" y="120" width="240" height="180" rx="12" fill="#D8E5DB"/>
    <path d="M220 160 L380 160 L380 270 L220 270 Z" fill="#1E5631" opacity="0.8"/>
    <circle cx="300" cy="200" r="36" fill="#FFCC4D"/>
    <text x="300" y="206" font-size="28" font-weight="800" fill="#121B17" text-anchor="middle">3300 PSI</text>
    <text x="300" y="340" font-size="13" font-weight="600" fill="#526059" text-anchor="middle">[ DeWalt Heavy Duty Pressure Washer Photo ]</text>

    <!-- Card Badge & Status -->
    <g transform="translate(88, 88)">
        <rect width="76" height="28" rx="14" fill="#1E5631"/>
        <text x="38" y="18" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LEND</text>
    </g>
    <g transform="translate(410, 88)">
        <rect width="110" height="28" rx="14" fill="#FFFFFF" opacity="0.95"/>
        <text x="55" y="18" font-size="12" font-weight="600" fill="#121B17" text-anchor="middle">Demo listing</text>
    </g>

    <!-- Card Meta info -->
    <g transform="translate(64, 388)">
        <text x="0" y="24" font-size="22" font-weight="700" fill="#121B17">DeWalt 3300 PSI Gas Pressure Washer</text>
        <text x="0" y="52" font-size="14" font-weight="500" fill="#526059">Includes 4 spray nozzles &amp; 50ft hose • Excellent Condition</text>
        
        <!-- Owner Info Bar -->
        <line x1="0" y1="72" x2="472" y2="72" stroke="#EEF2EF" stroke-width="1"/>
        <circle cx="20" cy="102" r="16" fill="#1E5631"/>
        <text x="20" y="107" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ER</text>
        <text x="48" y="100" font-size="14" font-weight="600" fill="#121B17">Elena R. <tspan font-weight="400" fill="#798880">(Maplewood)</tspan></text>
        <text x="48" y="118" font-size="12" font-weight="600" fill="#1E5631">Sample listing</text>
        
        <rect x="360" y="88" width="112" height="36" rx="10" fill="#E4EFE7"/>
        <text x="416" y="111" font-size="13" font-weight="700" fill="#1E5631" text-anchor="middle">Request Lend</text>
    </g>

    <!-- Overlapping Floating Secondary Visual Card (Camping Tent Card) -->
    <g transform="translate(-80, 360)">
        <rect width="280" height="200" rx="18" fill="#FFFFFF" stroke="#DDE4E0" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="16" y="16" width="248" height="100" rx="10" fill="#EEF2EF"/>
        <text x="140" y="68" font-size="12" font-weight="600" fill="#526059" text-anchor="middle">[ MSR 4-Person Tent ]</text>
        <rect x="28" y="28" width="60" height="22" rx="11" fill="#D97706"/>
        <text x="58" y="43" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">BORROW</text>
        <text x="16" y="142" font-size="15" font-weight="700" fill="#121B17">MSR Hubba Hubba Tent</text>
        <text x="16" y="162" font-size="12" font-weight="500" fill="#526059">Planning a weekend trip</text>
        <text x="16" y="182" font-size="11" font-weight="600" fill="#1E5631">Community demo listing</text>
    </g>

    <!-- Identity Motif Accent: Isometric Tree Graphic Input -->
    <g transform="translate(420, -20)">
        <rect width="80" height="80" rx="20" fill="#E4EFE7" stroke="#FFFFFF" stroke-width="4" filter="url(#cardShadow)"/>
        <path fill="#77B255" d="M40 18 L22 54 L32 54 L26 66 L54 66 L48 54 L58 54 Z"/>
        <path fill="#1E5631" d="M40 18 L40 66 L54 66 L48 54 L58 54 Z" opacity="0.3"/>
    </g>
</g>
</svg>