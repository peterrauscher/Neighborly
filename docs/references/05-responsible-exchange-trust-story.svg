<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
<defs>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
        text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        .shadow-sm { filter: drop-shadow(0px 2px 4px rgba(18, 27, 23, 0.04)); }
        .shadow-md { filter: drop-shadow(0px 8px 16px rgba(18, 27, 23, 0.08)); }
    </style>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E5631" />
        <stop offset="100%" stop-color="#143D22" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F6F8F6" />
        <stop offset="100%" stop-color="#EEF2EF" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#121B17" flood-opacity="0.06"/>
    </filter>
</defs>
<!-- Background Canvas -->
<rect width="1440" height="900" fill="#F6F8F6"/>

<g transform="translate(64, 70)">
    <!-- Header -->
    <rect width="170" height="30" rx="15" fill="#E4EFE7"/>
    <text x="85" y="20" font-size="12" font-weight="700" fill="#1E5631" text-anchor="middle" letter-spacing="0.5px">TRUST &amp; INVARIANTS</text>

    <text x="0" y="80" font-size="38" font-weight="800" fill="#121B17" letter-spacing="-1px">
        Built on real handoffs, not invasive surveillance.
    </text>
    <text x="0" y="112" font-size="16" font-weight="400" fill="#526059">
        Neighborly enforces privacy boundaries at the protocol layer.
    </text>

    <!-- TWO-COLUMN DOSSIER SPLIT (40% Security Guarantees + 60% Lifecycle Stepper & Member Voice) -->
    <g transform="translate(0, 160)">
        
        <!-- LEFT COLUMN: Privacy & Security Invariants (Width 520px) -->
        <g transform="translate(0, 0)">
            <!-- Card 1 -->
            <rect width="520" height="180" rx="18" fill="#FFFFFF" stroke="#DDE4E0" stroke-width="1" filter="url(#cardShadow)"/>
            <g transform="translate(28, 28)">
                <circle cx="16" cy="16" r="16" fill="#E4EFE7"/>
                <text x="16" y="22" font-size="16" font-weight="800" fill="#1E5631" text-anchor="middle">✓</text>
                <text x="48" y="22" font-size="18" font-weight="800" fill="#121B17">Same-Neighborhood Privacy</text>
                <text x="0" y="60" font-size="14" font-weight="400" fill="#526059" width="460">
                    <tspan x="0" dy="0">Precise street addresses are never broadcast publicly.</tspan>
                    <tspan x="0" dy="22">Handoff details are shared only in private</tspan>
                    <tspan x="0" dy="22">participant messaging threads.</tspan>
                </text>
            </g>

            <!-- Card 2 -->
            <g transform="translate(0, 200)">
                <rect width="520" height="180" rx="18" fill="#FFFFFF" stroke="#DDE4E0" stroke-width="1" filter="url(#cardShadow)"/>
                <g transform="translate(28, 28)">
                    <circle cx="16" cy="16" r="16" fill="#E4EFE7"/>
                    <text x="16" y="22" font-size="16" font-weight="800" fill="#1E5631" text-anchor="middle">✓</text>
                    <text x="48" y="22" font-size="18" font-weight="800" fill="#121B17">Earned Review Reputation</text>
                    <text x="0" y="60" font-size="14" font-weight="400" fill="#526059">
                        <tspan x="0" dy="0">Review privileges are unlocked exclusively after a completed</tspan>
                        <tspan x="0" dy="22">two-sided handoff. Every rating follows a</tspan>
                        <tspan x="0" dy="22">real completed exchange.</tspan>
                    </text>
                </g>
            </g>

            <!-- Card 3 -->
            <g transform="translate(0, 400)">
                <rect width="520" height="180" rx="18" fill="#FFFFFF" stroke="#DDE4E0" stroke-width="1" filter="url(#cardShadow)"/>
                <g transform="translate(28, 28)">
                    <circle cx="16" cy="16" r="16" fill="#E4EFE7"/>
                    <text x="16" y="22" font-size="16" font-weight="800" fill="#1E5631" text-anchor="middle">✓</text>
                    <text x="48" y="22" font-size="18" font-weight="800" fill="#121B17">No Ads. No Tracking. No Data Sales.</text>
                    <text x="0" y="60" font-size="14" font-weight="400" fill="#526059">
                        <tspan x="0" dy="0">No third-party ad scripts, tracking pixels, or data sales.</tspan>
                        <tspan x="0" dy="22">Neighborly is a clean open-source utility designed</tspan>
                        <tspan x="0" dy="22">solely for neighbor resource sharing.</tspan>
                    </text>
                </g>
            </g>
        </g>

        <!-- RIGHT COLUMN: Transaction Lifecycle Stepper & Member Quote (Width 760px) -->
        <g transform="translate(552, 0)">
            <!-- Stepper Container Card -->
            <rect width="760" height="340" rx="20" fill="#FFFFFF" stroke="#DDE4E0" stroke-width="1" filter="url(#cardShadow)"/>
            <rect x="0" y="0" width="760" height="8" rx="4" fill="#1E5631"/>
            
            <g transform="translate(36, 32)">
                <text x="0" y="24" font-size="20" font-weight="800" fill="#121B17">Deterministic Exchange Lifecycle</text>
                <text x="0" y="48" font-size="14" font-weight="400" fill="#526059">Every request transitions through audited state machine checks.</text>

                <!-- Stepper Visual -->
                <g transform="translate(0, 80)">
                    <!-- Step 1 -->
                    <rect width="150" height="140" rx="12" fill="#EEF2EF"/>
                    <circle cx="30" cy="30" r="14" fill="#1E5631"/>
                    <text x="30" y="35" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
                    <text x="16" y="70" font-size="14" font-weight="700" fill="#121B17">Request Sent</text>
                    <text x="16" y="92" font-size="11" font-weight="500" fill="#526059">Dates &amp; purpose submitted</text>
                    <rect x="16" y="110" width="60" height="18" rx="4" fill="#E4EFE7"/>
                    <text x="46" y="123" font-size="9" font-weight="700" fill="#1E5631" text-anchor="middle">PENDING</text>

                    <!-- Arrow 1 -->
                    <text x="160" y="95" font-size="20" font-weight="700" fill="#798880">→</text>

                    <!-- Step 2 -->
                    <g transform="translate(180, 0)">
                        <rect width="150" height="140" rx="12" fill="#EEF2EF"/>
                        <circle cx="30" cy="30" r="14" fill="#1E5631"/>
                        <text x="30" y="35" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
                        <text x="16" y="70" font-size="14" font-weight="700" fill="#121B17">Owner Accept</text>
                        <text x="16" y="92" font-size="11" font-weight="500" fill="#526059">Owner confirms dates</text>
                        <rect x="16" y="110" width="70" height="18" rx="4" fill="#E4EFE7"/>
                        <text x="51" y="123" font-size="9" font-weight="700" fill="#1E5631" text-anchor="middle">RESERVED</text>
                    </g>

                    <!-- Arrow 2 -->
                    <text x="340" y="95" font-size="20" font-weight="700" fill="#798880">→</text>

                    <!-- Step 3 -->
                    <g transform="translate(360, 0)">
                        <rect width="150" height="140" rx="12" fill="#EEF2EF"/>
                        <circle cx="30" cy="30" r="14" fill="#1E5631"/>
                        <text x="30" y="35" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
                        <text x="16" y="70" font-size="14" font-weight="700" fill="#121B17">Coordination</text>
                        <text x="16" y="92" font-size="11" font-weight="500" fill="#526059">Private 1:1 chat thread</text>
                        <rect x="16" y="110" width="60" height="18" rx="4" fill="#E4EFE7"/>
                        <text x="46" y="123" font-size="9" font-weight="700" fill="#1E5631" text-anchor="middle">ACTIVE</text>
                    </g>

                    <!-- Arrow 3 -->
                    <text x="520" y="95" font-size="20" font-weight="700" fill="#798880">→</text>

                    <!-- Step 4 -->
                    <g transform="translate(540, 0)">
                        <rect width="150" height="140" rx="12" fill="#1E5631"/>
                        <circle cx="30" cy="30" r="14" fill="#FFFFFF"/>
                        <text x="30" y="35" font-size="12" font-weight="800" fill="#1E5631" text-anchor="middle">4</text>
                        <text x="16" y="70" font-size="14" font-weight="700" fill="#FFFFFF">Reviewed</text>
                        <text x="16" y="92" font-size="11" font-weight="400" fill="#E4EFE7">5.0 ★ trust rating logged</text>
                        <rect x="16" y="110" width="74" height="18" rx="4" fill="#FFFFFF"/>
                        <text x="53" y="123" font-size="9" font-weight="800" fill="#1E5631" text-anchor="middle">COMPLETED</text>
                    </g>
                </g>
            </g>

            <!-- Member Experience Quote Card -->
            <g transform="translate(0, 370)">
                <rect width="760" height="210" rx="20" fill="#E4EFE7" stroke="#DDE4E0" stroke-width="1"/>
                <g transform="translate(40, 36)">
                    <text x="0" y="22" font-size="18" font-style="italic" font-weight="600" fill="#121B17" width="680">
                        <tspan x="0" dy="0">“We’ve shared our carpet cleaner and borrowed a tile saw for our kitchen</tspan>
                        <tspan x="0" dy="28">renovation. Neighborly turned our block into an actual resource network.”</tspan>
                    </text>
                    
                    <g transform="translate(0, 84)">
                        <circle cx="20" cy="20" r="20" fill="#1E5631"/>
                        <text x="20" y="26" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">DM</text>
                        <text x="52" y="18" font-size="15" font-weight="800" fill="#121B17">David &amp; Maya</text>
                        <text x="52" y="36" font-size="13" font-weight="500" fill="#526059">Maplewood Members • Seeded exchange history</text>
                    </g>
                </g>
            </g>
        </g>
    </g>
</g>
</svg>