<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#gameBg)"/>
  <!-- Board Game Box 1 -->
  <rect x="200" y="180" width="220" height="240" rx="12" fill="#0284c7" stroke="#38bdf8" stroke-width="4" transform="rotate(-10 310 300)"/>
  <text x="250" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" transform="rotate(-10 310 300)">WINGSPAN</text>
  <!-- Board Game Box 2 -->
  <rect x="380" y="170" width="230" height="250" rx="12" fill="#ea580c" stroke="#fb923c" stroke-width="4" transform="rotate(8 495 295)"/>
  <text x="440" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" transform="rotate(8 495 295)">CATAN</text>
  <!-- Dice -->
  <rect x="320" y="380" width="50" height="50" rx="8" fill="#ffffff"/>
  <circle cx="335" cy="395" r="4" fill="#ef4444"/>
  <circle cx="355" cy="415" r="4" fill="#ef4444"/>
  <!-- Badge -->
  <rect x="530" y="40" width="230" height="50" rx="25" fill="#f472b6"/>
  <text x="645" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#500724" text-anchor="middle">TRADE • GAMES</text>
  <text x="360" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="bold" fill="#fdf4ff" text-anchor="middle">Board Game Bundle</text>
</svg>
