<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="plantBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143621"/>
      <stop offset="100%" stop-color="#081c10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#plantBg)"/>
  <!-- Pots -->
  <g transform="translate(180, 260)">
    <polygon points="20,80 80,80 70,160 30,160" fill="#b45309"/>
    <ellipse cx="50" cy="80" rx="30" ry="10" fill="#d97706"/>
    <!-- Stem and leaves -->
    <path d="M 50 80 Q 40 30 50 0" stroke="#16a34a" stroke-width="6" fill="none"/>
    <ellipse cx="30" cy="40" rx="22" ry="12" fill="#22c55e" transform="rotate(-30 30 40)"/>
    <ellipse cx="68" cy="25" rx="22" ry="12" fill="#4ade80" transform="rotate(30 68 25)"/>
    <circle cx="50" cy="-5" r="10" fill="#ef4444"/>
  </g>
  <g transform="translate(350, 240)">
    <polygon points="20,80 80,80 70,160 30,160" fill="#b45309"/>
    <ellipse cx="50" cy="80" rx="30" ry="10" fill="#d97706"/>
    <path d="M 50 80 Q 60 20 50 -10" stroke="#16a34a" stroke-width="7" fill="none"/>
    <ellipse cx="25" cy="35" rx="26" ry="14" fill="#22c55e" transform="rotate(-35 25 35)"/>
    <ellipse cx="75" cy="20" rx="26" ry="14" fill="#4ade80" transform="rotate(25 75 20)"/>
    <circle cx="52" cy="-15" r="12" fill="#ef4444"/>
  </g>
  <g transform="translate(520, 260)">
    <polygon points="20,80 80,80 70,160 30,160" fill="#b45309"/>
    <ellipse cx="50" cy="80" rx="30" ry="10" fill="#d97706"/>
    <path d="M 50 80 Q 35 30 50 5" stroke="#16a34a" stroke-width="6" fill="none"/>
    <ellipse cx="30" cy="45" rx="22" ry="12" fill="#22c55e" transform="rotate(-25 30 45)"/>
    <ellipse cx="70" cy="30" rx="22" ry="12" fill="#4ade80" transform="rotate(35 70 30)"/>
    <circle cx="50" cy="2" r="9" fill="#ef4444"/>
  </g>
  <!-- Badge -->
  <rect x="530" y="40" width="230" height="50" rx="25" fill="#4ade80"/>
  <text x="645" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#052e16" text-anchor="middle">TRADE • GARDEN</text>
  <text x="360" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="bold" fill="#f0fdf4" text-anchor="middle">Organic Tomato Seedlings</text>
</svg>
