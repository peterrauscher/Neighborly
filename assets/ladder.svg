<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ladderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ladderBg)"/>
  <!-- Ladder Rails leaning -->
  <line x1="330" y1="90" x2="250" y2="440" stroke="url(#metal)" stroke-width="16" stroke-linecap="round"/>
  <line x1="470" y1="90" x2="390" y2="440" stroke="url(#metal)" stroke-width="16" stroke-linecap="round"/>
  <!-- Rungs -->
  <line x1="320" y1="130" x2="455" y2="130" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <line x1="308" y1="180" x2="445" y2="180" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <line x1="297" y1="230" x2="433" y2="230" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <line x1="285" y1="280" x2="422" y2="280" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <line x1="273" y1="330" x2="410" y2="330" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <line x1="262" y1="380" x2="398" y2="380" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <line x1="250" y1="430" x2="387" y2="430" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <!-- Badge -->
  <rect x="530" y="40" width="230" height="50" rx="25" fill="#38bdf8"/>
  <text x="645" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">BORROW • HOME</text>
  <text x="400" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="bold" fill="#f8fafc" text-anchor="middle">16ft Extension Ladder</text>
</svg>
